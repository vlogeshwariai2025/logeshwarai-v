<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Generated Comics - ComicCraft</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 30px 15px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { color: #0f172a; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #334155; }
    .btn-action { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 ComicCraft Activity & Records</h1>
    <p>Listing of recent exports and generated comic sessions.</p>
    <table>
      <thead>
        <tr>
          <th>Session ID</th>
          <th>Character</th>
          <th>Setting</th>
          <th>PDF Export</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#001</td>
          <td>Free</td>
          <td>Enchanted Forest</td>
          <td>comic_demo.pdf</td>
          <td><a href="/" class="btn-action">Create New</a></td>
        </tr>
      </tbody>
    </table>
    <br>
    <a href="/" style="display:inline-block; padding:10px 18px; background:#2563eb; color:white; border-radius:8px; text-decoration:none;">← Return to Creator</a>
  </div>
</body>
</html>
